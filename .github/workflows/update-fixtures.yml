name: Update Camden United Fixtures

on:
  # Local London time is observed automatically across GMT/BST.
  schedule:
    - cron: '0 20 * * 0'
      timezone: 'Europe/London'
    - cron: '0 21 * * 0'
      timezone: 'Europe/London'
    - cron: '0 22 * * 0'
      timezone: 'Europe/London'
    - cron: '0 23 * * 0'
      timezone: 'Europe/London'
  # Allows a controlled Sunday run and runs once when this workflow is installed.
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-fixtures.yml'
      - 'scripts/sync_fixtures.py'

permissions:
  contents: write

concurrency:
  group: camden-fixtures-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: pip install -r requirements-fixtures.txt

      - name: Check alternative public source accessibility
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import requests
          urls = {
            'jina_ogs': 'https://r.jina.ai/https://fulltime.thefa.com/displayTeam.html?id=144179498',
            'jina_midweek': 'https://r.jina.ai/https://fulltime.thefa.com/displayTeam.html?id=380596793',
            'jina_first': 'https://r.jina.ai/https://mitoofootball.com/TeamHistAll.cfm?CI=68&TblName=Matches&LeagueCode=MDX2026&DivisionID=64',
            'bing_rss': 'https://www.bing.com/search?format=rss&q=site%3Afulltime.thefa.com%2FdisplayTeam.html+%22Camden+United%22+2026',
          }
          for name, url in urls.items():
              try:
                  r = requests.get(url, timeout=18, headers={'User-Agent':'Mozilla/5.0'})
                  body = r.text
                  print(name, r.status_code, len(body), body[:120].replace('\\n',' '))
                  if name in ('jina_ogs', 'jina_midweek') and r.ok:
                      at=body.find('Upcoming Fixtures')
                      if at < 0: at=body.find('Upcoming fixtures')
                      print(name, 'upcoming_at', at, 'sample:', repr(body[at:at+4200] if at>=0 else body[:1000]))
              except Exception as e:
                  print(name, type(e).__name__, str(e)[:160])
          PY

      - name: Read public fixtures (Sunday from 8pm UK only)
        id: sync
        continue-on-error: true
        run: python scripts/sync_fixtures.py

      - name: Commit only validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fixtures-synced.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Camden United fixtures"
            git push
          else
            echo "No fixture changes"
          fi

      - name: Mark partial or failed sync for retry on Sunday
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more league sources could not be verified. Existing fixtures were kept; the next Sunday checkpoint will retry."
          exit 1

name: Inspect First Team Standings Sources
on:
  push:
    paths: ['.github/workflows/inspect-first-standings.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public 2026-27 standings sources
        run: |
          python - <<'PY'
          import requests,re
          from concurrent.futures import ThreadPoolExecutor
          targets={
            "nlm_www": "https://www.nonleaguematters.co.uk/divisions/62/",
            "nlm_no_www": "https://nonleaguematters.co.uk/divisions/62/",
            "nlm_form": "https://www.nonleaguematters.co.uk/divisions/62/F/",
            "mitoo_www": "https://www.mitoofootball.com/LeagueTab.cfm?TblName=Matches&DivisionID=64&LeagueCode=MDX2026",
            "mitoo_http": "http://mitoofootball.com/LeagueTab.cfm?TblName=Matches&DivisionID=64&LeagueCode=MDX2026",
            "nlm_reader": "https://r.jina.ai/https://www.nonleaguematters.co.uk/divisions/62/",
          }
          def test(item):
            name,url=item
            try:
              r=requests.get(url,timeout=18,headers={"User-Agent":"Mozilla/5.0"})
              t=r.text
              p=t.lower().find("league table")
              return {"name":name,"status":r.status_code,"len":len(t),"url":r.url,"table_pos":p,"sample":re.sub(r"\\s+"," ",t[max(p-120,0):p+270]) if p>=0 else t[:160],"camden":'Camden United' in t,"date2026":'November 2026' in t or 'Nov 2026' in t}
            except Exception as e:return {"name":name,"error":str(e)[:200]}
          with ThreadPoolExecutor(max_workers=6) as pool:
            for row in pool.map(test,targets.items()):print(row,flush=True)
          PY
name: Inspect First Team Standings Sources
on:
  push:
    paths: ['.github/workflows/inspect-first-standings.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install beautifulsoup4 requests
      - run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          r=requests.get('https://www.nonleaguematters.co.uk/divisions/62/',timeout=25)
          s=BeautifulSoup(r.text,'html.parser')
          t=s.select_one('table.league')
          print('found',bool(t),'rows',len(t.select('tr')) if t else 0)
          for row in t.select('tr')[:12]:
              cells=row.find_all(['th','td'],recursive=False)
              print('row', len(cells),[(c.get('colspan'),c.get_text(' ',strip=True)) for c in cells][:24])
          print('headline',s.title.get_text(' ',strip=True) if s.title else None)
          print('2026-27?', '2026 - 2027' in s.get_text(' ',strip=True))
          PY
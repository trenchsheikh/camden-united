name: Inspect Public League Table Sources
on:
  push:
    paths: ['.github/workflows/probe-tables.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect active divisions for current season
        run: |
          python - <<'PY'
          import requests, re
          from concurrent.futures import ThreadPoolExecutor
          urls={
            "midweek": "https://fulltime.thefa.com/displayTeam.html?id=380596793",
            "ogs": "https://fulltime.thefa.com/displayTeam.html?id=144179498",
            "current_index": "https://fulltime.thefa.com/index.html?league=695549151&selectedSeason=224702165",
            "current_tables": "https://fulltime.thefa.com/table.html?league=695549151&selectedSeason=224702165",
            "current_div1": "https://fulltime.thefa.com/index.html?league=695549151&selectedCompetition=0&selectedDivision=436230581&selectedFixtureGroupKey=1_311845301&selectedSeason=224702165",
            "current_div3": "https://fulltime.thefa.com/index.html?league=695549151&selectedCompetition=0&selectedDivision=954226676&selectedFixtureGroupKey=1_860713087&selectedSeason=224702165",
          }
          def run(item):
              name,url=item
              try:
                  r=requests.get("https://r.jina.ai/"+url,timeout=32,headers={"X-Return-Format":"markdown"})
                  body=r.text
                  output=[name+" status="+str(r.status_code)+" len="+str(len(body))]
                  for key in ["selectedDivision","Division 1","Division 3","Division One","Division Three","divisionseason=", "## League Table"]:
                      poss=[m.start() for m in list(re.finditer(re.escape(key),body,re.I))][:5]
                      output.append(key+" "+str(poss))
                      for x in poss[:2]:
                          output.append(repr(body[max(0,x-200):x+320]))
                  return "\n".join(output)
              except Exception as e:
                  return name+" error "+str(e)
          with ThreadPoolExecutor(max_workers=6) as pool:
              for x in pool.map(run,urls.items()):
                  print(x,flush=True)
          PY
name: Update Camden United League Tables

on:
  # Ten minutes after the fixture sync; all times are UK local, including BST.
  schedule:
    - cron: '10 20 * * 0'
      timezone: 'Europe/London'
    - cron: '10 21 * * 0'
      timezone: 'Europe/London'
    - cron: '10 22 * * 0'
      timezone: 'Europe/London'
    - cron: '10 23 * * 0'
      timezone: 'Europe/London'
  workflow_dispatch:
  # Initial Sunday test, and tests for changes to standings automation.
  push:
    paths:
      - '.github/workflows/update-league-tables.yml'
      - 'scripts/sync_league_tables.py'

permissions:
  contents: write

concurrency:
  group: camden-league-tables
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source fetcher
        run: pip install -r requirements-fixtures.txt

      - name: Retrieve validated league tables (Sunday evening UK)
        id: sync
        continue-on-error: true
        run: python scripts/sync_league_tables.py

      - name: Commit updated standings (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/league-tables.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Camden United league tables"
            git push
          else
            echo "No league table changes"
          fi

      - name: Report partial source failure for Sunday retry
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Some league standings could not be verified. Previously confirmed tables were preserved and the next Sunday checkpoint will retry."
          exit 1
